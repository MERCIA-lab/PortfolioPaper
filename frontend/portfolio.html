<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portfolio — Portfolio Paper</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body data-page="profile">
    <div class="site-shell">
      <header class="site-header">
        <a class="wordmark" href="index.html">PORTFOLIO PAPER</a>
        <nav class="desktop-nav" aria-label="Main navigation"><a href="directory.html">Explore portfolios</a></nav>
        <div class="header-actions"><a class="text-link" href="login.html">Sign in</a><a class="button button-dark" href="form.html">Create yours</a></div>
      </header>
      <main class="page-main profile-page">
        <div class="profile-actions"><a class="button button-outline" href="directory.html">Back to directory</a><button class="button button-outline" type="button" data-print>Print portfolio</button></div>
        <p class="notice" data-status aria-live="polite">Loading portfolio…</p>
        <article class="profile-paper" hidden>
          <header class="profile-header">
            <div class="profile-header-main">
              <div class="profile-heading"><h1></h1><p class="profile-role"></p><p class="profile-contact"></p></div>
              <img class="profile-photo" alt="" hidden>
            </div>
          </header>
          <div class="profile-content"></div>
        </article>
      </main>
      <footer class="site-footer"><a class="wordmark" href="index.html">PORTFOLIO PAPER</a><span>© 2026 Portfolio Paper</span></footer>
    </div>
  </body>
</html>
