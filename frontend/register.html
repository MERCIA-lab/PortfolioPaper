<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account — Portfolio Paper</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body data-page="register">
    <div class="site-shell">
      <header class="site-header">
        <a class="wordmark" href="index.html">PORTFOLIO PAPER</a>
        <nav class="desktop-nav" aria-label="Main navigation"><a href="directory.html">Explore portfolios</a></nav>
        <div class="header-actions"><a class="text-link" href="login.html">Sign in</a></div>
      </header>
      <main class="page-main">
        <section class="form-panel narrow">
          <h1 class="page-title">Create your account.</h1>
          <p class="page-intro">Start a personal portfolio and make one page for your experience, skills and work.</p>
          <form data-auth-form="register">
            <div class="form-grid">
              <label class="field full"><span>Your name</span><input type="text" name="username" autocomplete="username" required maxlength="150"></label>
              <label class="field full"><span>Email address</span><input type="email" name="email" autocomplete="email" required></label>
              <label class="field full"><span>Password</span><input type="password" name="password" autocomplete="new-password" minlength="8" required><small class="field-hint">Use at least 8 characters.</small></label>
            </div>
            <p class="form-error" aria-live="polite"></p>
            <div class="form-actions"><button class="button button-dark" type="submit">Create account</button></div>
          </form>
          <p class="form-switch">Already have an account? <a href="login.html">Sign in</a></p>
        </section>
      </main>
      <footer class="site-footer"><a class="wordmark" href="index.html">PORTFOLIO PAPER</a><span>© 2026 Portfolio Paper</span></footer>
    </div>
  </body>
</html>
