<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — Portfolio Paper</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body data-page="login">
    <div class="site-shell">
      <header class="site-header">
        <a class="wordmark" href="index.html">PORTFOLIO PAPER</a>
        <nav class="desktop-nav" aria-label="Main navigation"><a href="directory.html">Explore portfolios</a></nav>
        <div class="header-actions"><a class="text-link" href="register.html">Create account</a></div>
      </header>
      <main class="page-main">
        <section class="form-panel narrow">
          <h1 class="page-title">Welcome back.</h1>
          <p class="page-intro">Sign in to update your portfolio and manage what you share.</p>
          <form data-auth-form="login">
            <div class="form-grid">
              <label class="field full"><span>Email address</span><input type="email" name="email" autocomplete="email" required></label>
              <label class="field full"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
            </div>
            <p class="form-error" aria-live="polite"></p>
            <div class="form-actions"><button class="button button-dark" type="submit">Sign in</button></div>
          </form>
          <p class="form-switch">New to Portfolio Paper? <a href="register.html">Create an account</a></p>
        </section>
      </main>
      <footer class="site-footer"><a class="wordmark" href="index.html">PORTFOLIO PAPER</a><span>© 2026 Portfolio Paper</span></footer>
    </div>
  </body>
</html>
